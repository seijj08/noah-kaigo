.input,.textarea,.select{width:100%;padding:14px;border:1px solid #D1D5DB;border-radius:10px;font-size:16px;background:#fff;font-family:inherit;color:#1F2937;}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:#2A9D8F;box-shadow:0 0 0 3px rgba(42,157,143,.15);}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 4px rgba(0,0,0,.04);border:1px solid #E5E7EB;}
.label{font-size:13px;font-weight:600;color:#4B5563;margin-bottom:6px;display:block;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;}
.tag-green{background:#D1FAE5;color:#065F46;}
.tag-yellow{background:#FEF3C7;color:#92400E;}
.tag-red{background:#FEE2E2;color:#991B1B;}
.tag-blue{background:#DBEAFE;color:#1E40AF;}

.tag-purple{background:#EDE9FE;color:#5B21B6;}

.score-bar-fill{height:100%;background:linear-gradient(to right,#9AD5CB,#2A9D8F);}
.fade-in{animation:fadeIn .25s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.quiz-container{max-width:520px;margin:0 auto;padding:0 16px;}
.dashboard-container{max-width:1280px;margin:0 auto;padding:0 16px;}
.tab-btn{padding:12px 0;border:none;background:none;font-size:13px;cursor:pointer;color:#6B7280;font-weight:500;border-bottom:2px solid transparent;font-family:inherit;}
.tab-btn.active{color:#2A9D8F;font-weight:700;border-bottom-color:#2A9D8F;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow-y:auto;}
.disclaimer{background:#FFFBEB;border:1px solid #FDE68A;color:#78350F;border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.6;}
.chart-box{position:relative;height:300px;}
.chart-box-sm{position:relative;height:200px;}
table.plain{width:100%;border-collapse:collapse;font-size:12px;}
table.plain th,table.plain td{padding:6px 8px;border-bottom:1px solid #F3F4F6;text-align:left;}
table.plain th{font-size:11px;color:#6B7280;font-weight:600;}
.print-only{display:none;}
@media (max-width:760px){#grid-charts,#grid-fit{grid-template-columns:1fr!important;}}
@media print{

//==========================================================
// スコア計算
//==========================================================
// 正規化: 加点は「加点の満点」、減点は「減点の満点」を分母にする（茶の花版 v1.1 / ドライバー版 v7.8 と同じ修正）
function maxPossible(key,dir){
  let s=0;
  QUESTIONS.forEach(q=>{
    if(q.type==='text')return;
    let m=0;
    q.options.forEach(o=>{const v=(o.s||{})[key]||0;m=Math.max(m,dir<0?-v:v);});
    s+=m;
  });
  return s;
}
const _maxCache={};
function maxP(key,dir){const k=key+':'+dir;if(!(k in _maxCache))_maxCache[k]=maxPossible(key,dir);return _maxCache[k];}
function normOne(v,key){
  if(v>=0){const pos=Math.max(2,maxP(key,1));return Math.min(10,5+(v/pos)*5);}
  const neg=Math.max(2,maxP(key,-1));return Math.max(0,5+(v/neg)*5);
}
function calcScores(answers){
  answers=answers||{};
  const t={},r={},d={},f={};
  Object.keys(TRAITS).forEach(k=>t[k]=0);
  Object.keys(RISKS).forEach(k=>r[k]=0);
  Object.keys(DRIVES).forEach(k=>d[k+'_d']=0);
  Object.keys(FIT).forEach(k=>f[k]=0);
  let answered=0;
  QUESTIONS.forEach(q=>{
    if(q.type==='text')return;
    const sel=answers[q.id];if(sel==null)return;
    const opt=q.options[sel];if(!opt)return;
    answered++;
    Object.entries(opt.s||{}).forEach(([k,v])=>{
      if(k in t)t[k]+=v;
      if(k in r)r[k]+=v;
      if(k in d)d[k]+=v;
      if(k in f)f[k]+=v;
    });
  });
  const norm={};Object.keys(TRAITS).forEach(k=>norm[k]=normOne(t[k],k));
  const normR={};Object.keys(RISKS).forEach(k=>normR[k]=normOne(r[k],k));
  const normF={};Object.keys(FIT).forEach(k=>normF[k]=normOne(f[k],k));
  const driveTotal=Object.values(d).reduce((a,b)=>a+Math.max(0,b),0);
  const normD={};
  Object.keys(DRIVES).forEach(k=>{const v=Math.max(0,d[k+'_d']);normD[k]=driveTotal>0?(v/driveTotal)*100:25;});
  return{traits:norm,risks:normR,drives:normD,fit:normF,raw:t,rawRisks:r,rawDrives:d,rawFit:f,answered};
}
function countSignals(answers,key,positive){
  if(!answers)return 99;
  let c=0;
  QUESTIONS.forEach(q=>{
    if(q.type==='text')return;
    const sel=answers[q.id];if(sel==null)return;
    const opt=q.options[sel];if(!opt)return;
    const v=(opt.s||{})[key]||0;
    if(positive&&v>0)c++;else if(!positive&&v<0)c++;
  });
  return c;
}
// 注意点の自動検出
function detectFlags(scores,answers){
  const f=[];const t=scores.traits;const r=scores.risks;const d=scores.drives||{};
  if(t.emo<3)f.push({level:'red',label:'情緒の安定に懸念（短気）'});
  if(t.rule<3)f.push({level:'red',label:'規範意識が低い'});
  if(t.integ<3)f.push({level:'red',label:'誠実さに懸念'});
  if(t.empathy<3)f.push({level:'red',label:'共感性が低い'});
  else if(t.empathy<4.5&&countSignals(answers,'empathy',false)>=2)f.push({level:'yellow',label:'共感性に懸念'});
  if(t.careAcc<3)f.push({level:'red',label:'身体介助への抵抗感が強い'});
  else if(t.careAcc<4.5&&countSignals(answers,'careAcc',false)>=2)f.push({level:'yellow',label:'介助受容性に懸念'});
  if(t.long<4&&countSignals(answers,'long',false)>=2)f.push({level:'yellow',label:'日本での長期就労意欲が弱い'});
  if(t.clean<4&&countSignals(answers,'clean',false)>=2)f.push({level:'yellow',label:'清潔感に要指導'});
  if(t.resil<4&&countSignals(answers,'resil',false)>=2)f.push({level:'yellow',label:'ストレス耐性が低い'});
  if(t.fin<4&&countSignals(answers,'fin',false)>=2)f.push({level:'yellow',label:'金銭管理に懸念'});
  if(t.fam<4&&countSignals(answers,'fam',false)>=2)f.push({level:'yellow',label:'家族の支援が弱い'});
  if(r.alc>7&&countSignals(answers,'alc',true)>=2)f.push({level:'red',label:'飲酒頻度が高い'});
  if(r.smoke>7)f.push({level:'yellow',label:'喫煙習慣あり'});
  if(r.digi>7&&countSignals(answers,'digi',true)>=2)f.push({level:'yellow',label:'スマホ依存傾向'});
  if(r.avoid>7&&countSignals(answers,'avoid',true)>=2)f.push({level:'yellow',label:'対立回避が強い'});
  if(r.impulse>7&&countSignals(answers,'impulse',true)>=2)f.push({level:'red',label:'衝動性が高い'});
  if(r.revenge>7&&countSignals(answers,'revenge',true)>=2)f.push({level:'red',label:'見返し・復讐心が強い'});
  if(d.money>50)f.push({level:'yellow',label:'金銭ドライブ過剰'});
  if(d.prestige>50)f.push({level:'yellow',label:'承認・プライド過剰'});
  if(d.freedom>50)f.push({level:'yellow',label:'自由志向過剰'});
  return f;
}
function getDriveType(drives){
  const max=Object.entries(drives).sort((a,b)=>b[1]-a[1])[0];
  const types={
    money:{ja:'金銭ドライブ型',desc:'稼ぐことが第一動機。給料・手当に敏感。'},
    prestige:{ja:'承認ドライブ型',desc:'認められることを重視。プライドが高く、褒めると伸びる。'},
    freedom:{ja:'自由ドライブ型',desc:'拘束を嫌う。裁量を与えると力を発揮。'},
    relation:{ja:'関係ドライブ型',desc:'人とのつながりが第一。チーム配属で活きる。'}
  };
  return{type:max[0],pct:max[1].toFixed(0),...types[max[0]]};
}

// 7項目の判定・回答の一貫性・面接で確かめたい点
//==========================================================
function mean(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;}
function checkConsistency(answers){
  answers=answers||{};
  const hits=[];
  CONSISTENCY.forEach(p=>{
    const a=answers[p.a[0]],b=answers[p.b[0]];
    if(a==null||b==null)return;
    if(p.a[1].includes(a)&&p.b[1].includes(b))hits.push(p);
  });
  const level=hits.length===0?'high':hits.length<=2?'mid':'low';
  const label={high:'高',mid:'中',low:'低'}[level];
  return{hits,level,label,count:hits.length};
}
function judgeFit(fit,cons){
  const avgA=mean(FIT_A.map(k=>fit[k]));
  const avgB=mean(FIT_B.map(k=>fit[k]));
  const lowA=FIT_A.filter(k=>fit[k]<5);
  const reasons=[];
  let type,label,color,bg;
  const f1=v=>v.toFixed(1);
  if(cons.level==='low'){
    type='unclear';label='どちらとも言えない';
    reasons.push(`回答の一貫性が低い（矛盾 ${cons.count}組）ため、点数の解釈を保留`);
    reasons.push(`参考: 定着5項目の平均 ${f1(avgA)} / 訪問系2項目の平均 ${f1(avgB)}`);
  }else if(avgA>=6.5&&lowA.length===0&&avgB<7){
    type='settle';label='定着プラン向き';
    reasons.push(`定着5項目の平均 ${f1(avgA)}（6.5以上）`);
    reasons.push('5点未満の定着項目なし');
    reasons.push(`訪問系2項目の平均 ${f1(avgB)}（7未満）`);
  }else if(avgB>=7&&fit.stay<6){
    type='visit';label='訪問系ルート向き';
    reasons.push(`訪問系2項目の平均 ${f1(avgB)}（7以上）: 稼ぎたい意欲 ${f1(fit.earn)} / キャリア志向 ${f1(fit.career)}`);
    reasons.push(`同じ職場で長く ${f1(fit.stay)}（6未満）`);
    if(avgA>=6.5)reasons.push(`定着5項目の平均も ${f1(avgA)} と高く、1年目は定着プランでも働ける見込み`);
  }else{
    type='unclear';label='どちらとも言えない';
    if(avgA<6.5)reasons.push(`定着5項目の平均 ${f1(avgA)}（6.5未満）`);
    if(lowA.length)reasons.push(`5点未満の定着項目: ${lowA.map(k=>FIT[k].short+' '+f1(fit[k])).join('、')}`);
    if(avgB>=7&&fit.stay>=6)reasons.push(`訪問系2項目の平均 ${f1(avgB)} と高いが、同じ職場で長く ${f1(fit.stay)} も高い（両立型）`);
    if(avgA>=6.5&&lowA.length===0&&avgB>=7)reasons.push(`定着5項目も訪問系2項目も高い。1年目は定着、その後の希望を面接で確認`);
    if(!reasons.length)reasons.push(`定着5項目の平均 ${f1(avgA)} / 訪問系2項目の平均 ${f1(avgB)} で、どちらの目安にも達していない`);
  }
  const style={settle:{color:'#065F46',bg:'#D1FAE5'},visit:{color:'#1E40AF',bg:'#DBEAFE'},unclear:{color:'#92400E',bg:'#FEF3C7'}}[type];
  return{type,label,reasons,avgA,avgB,lowA,...style};
}
function interviewPoints(fit,cons){
  const pts=[];
  cons.hits.forEach(p=>pts.push({kind:'矛盾',title:p.label,ask:p.ask}));
  FIT_A.filter(k=>fit[k]<5).sort((a,b)=>fit[a]-fit[b]).forEach(k=>pts.push({kind:'低い項目',title:`${FIT[k].ja}が低め（${fit[k].toFixed(1)}）`,ask:INTERVIEW_Q[k]}));
  FIT_A.filter(k=>fit[k]>=5&&fit[k]<6).sort((a,b)=>fit[a]-fit[b]).forEach(k=>pts.push({kind:'やや低い項目',title:`${FIT[k].ja}がやや低め（${fit[k].toFixed(1)}）`,ask:INTERVIEW_Q[k]}));
  if(mean(FIT_B.map(k=>fit[k]))>=7)pts.push({kind:'志向',title:`訪問系への志向が強い（稼ぎたい意欲 ${fit.earn.toFixed(1)} / キャリア志向 ${fit.career.toFixed(1)}）`,ask:'1年後のキャリア希望（訪問介護、資格、運転）と、その間デイサービスで働く意思を確認する'});
  return pts.slice(0,3);
}

function calcCompatibility(candScores,memb){
  let sim=0,total=0;
  Object.keys(TRAITS).forEach(k=>{const a=candScores.traits[k];const b=memb.traits[k]??5;sim+=10-Math.abs(a-b);total+=10;});
  let score=(sim/total)*10;
  const risks=[],positives=[];
  const cT=candScores.traits,mT=memb.traits||{};
  const cR=candScores.risks,mR=memb.risks||{};
  const cD=candScores.drives||{},mD=memb.drives||{};
  if(cT.emo<5&&(mT.emo??5)<5){score-=1.5;risks.push('両者とも情緒が不安定で衝突しやすい');}
  if(cR.alc>6&&(mR.alc||0)>6){score-=1;risks.push('両者とも飲酒頻度が高い');}
  if(cT.clean<5&&(mT.clean??5)<5){score-=1;risks.push('両者とも清潔感が低く、寮の衛生に注意');}
  if(cT.rule<5&&(mT.rule??5)<5){score-=1;risks.push('両者ともルール意識が低い');}
  if(cR.impulse>6&&(mR.impulse||0)>6){score-=1.5;risks.push('両者とも衝動性が高く、些細な事で衝突しやすい');}
  if(cR.revenge>6&&(mR.revenge||0)>6){score-=1.5;risks.push('両者とも見返し心が強く、不仲が長期化しやすい');}
  if((cD.prestige||0)>40&&(mD.prestige||0)>40){score-=1;risks.push('両者とも承認欲求が強い');}
  if((cD.money||0)>45&&(mD.money||0)>45){score-=0.5;risks.push('両者とも金銭ドライブが強く、待遇で揉める可能性');}
  if((cD.freedom||0)>45&&(mT.rule??5)>=7){score-=0.5;risks.push('候補者が自由志向、メンバーがルール重視で価値観が衝突しやすい');}
  if(memb.isBenchmark&&cT.consc>=6){positives.push('基準メンバーの指導を素直に受けやすい');}
  if((mT.comm??5)>=7&&cT.comm<5){positives.push('コミュニケーションの強いメンバーが候補者の弱みを補完');}
  if((mT.long??5)>=8&&cT.long>=7){positives.push('双方が長期就労意欲で安定したチーム');}
  if((cD.relation||0)>35&&(mD.relation||0)>35){positives.push('双方が関係ドライブ型で絆を作りやすい');}
  if((cD.prestige||0)>35&&(mT.comm??5)>=7){positives.push('プライド型候補に対し、メンバーが褒めて伸ばせる');}
  score=Math.max(1,Math.min(10,score));
  let advice;
  if(score>=8)advice='同じチーム・近接配置を強く推奨';
  else if(score>=6)advice='問題なし、近接配置可';
  else if(score>=4)advice='近接配置可、ただし初期1か月は密に観察';
  else advice='別チーム配置を推奨';
  return{score,sim:sim/total,risks,positives,advice};
}
function getAllPeople(){
  const people=[];
  groupedLatest().forEach(s=>{
    const sc=calcScores(s.answers);
    people.push({id:'c:'+s.id,refId:s.id,type:'candidate',name:s.name,subtitle:'候補者 '+fmtDate(s.submittedAt),traits:sc.traits,risks:sc.risks,drives:sc.drives});

  });
  return people;
}
function calcPairCompat(a,b){
  let sim=0,total=0;
  Object.keys(TRAITS).forEach(k=>{const av=a.traits[k]??5,bv=b.traits[k]??5;sim+=10-Math.abs(av-bv);total+=10;});
  let score=(sim/total)*10;
  const risks=[],positives=[];
  const aT=a.traits,bT=b.traits,aR=a.risks||{},bR=b.risks||{},aD=a.drives||{},bD=b.drives||{};
  if((aT.emo??5)<5&&(bT.emo??5)<5){score-=1.5;risks.push('両者とも情緒が不安定');}
  if((aR.alc||0)>6&&(bR.alc||0)>6){score-=1;risks.push('両者とも飲酒頻度が高い');}
  if((aT.clean??5)<5&&(bT.clean??5)<5){score-=1;risks.push('両者とも清潔感が低い');}
  if((aT.rule??5)<5&&(bT.rule??5)<5){score-=1;risks.push('両者ともルール意識が低い');}
  if((aR.impulse||0)>6&&(bR.impulse||0)>6){score-=1.5;risks.push('両者とも衝動性が高い');}
  if((aR.revenge||0)>6&&(bR.revenge||0)>6){score-=1.5;risks.push('両者とも見返し心が強い');}
  if((aD.prestige||0)>40&&(bD.prestige||0)>40){score-=1;risks.push('両者ともプライド型');}
  if((aD.money||0)>45&&(bD.money||0)>45){score-=0.5;risks.push('両者とも金銭志向が強い');}
  if(a.isBenchmark||b.isBenchmark){const other=a.isBenchmark?b:a;if((other.traits.consc??5)>=6)positives.push('基準メンバーの指導を受けやすい');}
  if((aT.comm??5)>=7&&(bT.comm??5)<5)positives.push(esc(a.name)+'のコミュニケーション力が補完');
  if((bT.comm??5)>=7&&(aT.comm??5)<5)positives.push(esc(b.name)+'のコミュニケーション力が補完');
  if((aT.long??5)>=8&&(bT.long??5)>=7)positives.push('双方が長期就労意欲');
  if((aD.relation||0)>35&&(bD.relation||0)>35)positives.push('双方が関係ドライブ型');
  score=Math.max(1,Math.min(10,score));
  let advice;
  if(score>=8)advice='相性良好。同じチーム配置を推奨';
  else if(score>=6)advice='問題なし。近接配置可';
  else if(score>=4)advice='初期1か月は密に観察';
  else advice='別チーム配置を推奨';
  return{score,sim:sim/total,risks,positives,advice};
}

let state=loadCache();
function loadCache(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r);}catch(e){}return{submissions:[],members:[]};}
function saveCache(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}

function nowIso(){return new Date().toISOString();}
function who(){return settings.userName||'unknown';}
function normalizeName(n){return String(n||'').normalize('NFKC').toLowerCase().replace(/[\s　.,'’‐-]/g,'');}

function activeMembers(){return state.members.filter(m=>m&&!m.deleted);}

function subToRow(s){return{id:s.id,name:s.name,contact:s.contact||'',lang:s.lang||'',candidate_key:s.candidateKey||normalizeName(s.name),answers:s.answers||{},timing:s.timing||{},notes:s.notes||'',submitted_at:s.submittedAt,updated_at:s.updatedAt||nowIso(),updated_by:s.updatedBy||who(),deleted:!!s.deleted};}

function rowToMem(r){return{id:r.id,name:r.name,company:r.company||CONFIG.companyName,isBenchmark:!!r.is_benchmark,traits:r.traits||{},risks:r.risks||{},drives:r.drives||{},fit:r.fit||{},notes:r.notes||'',sourceSubmissionId:r.source_submission_id||null,updatedAt:r.updated_at,updatedBy:r.updated_by,deleted:!!r.deleted};}

async function syncPull(silent){
  if(!sb||!sbSession)return;
  sync.syncing=true;sync.error=null;updateSyncBadge();
  try{
    const [a,b]=await Promise.all([
      sb.from(CONFIG.TABLE_SUB).select('*').eq('deleted',false).order('submitted_at',{ascending:false}),
      sb.from(CONFIG.TABLE_MEM).select('*').eq('deleted',false).order('name')
    ]);
    if(a.error)throw a.error;if(b.error)throw b.error;
    state.submissions=a.data.map(rowToSub);
    state.members=b.data.map(rowToMem);
    saveCache();
    sync.lastPullAt=new Date();
  }catch(e){sync.error=e.message||String(e);console.error('syncPull',e);if(!silent)alert('データ取得エラー: '+sync.error);}
  sync.syncing=false;updateSyncBadge();
}
async function dbUpsertSub(s){
  s.updatedAt=nowIso();s.updatedBy=who();saveCache();
  if(!sb||!sbSession)return;
  const {error}=await sb.from(CONFIG.TABLE_SUB).upsert(subToRow(s));
  if(error){sync.error=error.message;alert('保存エラー: '+error.message);}
  updateSyncBadge();
}
async function dbUpsertMem(m){
  m.updatedAt=nowIso();m.updatedBy=who();saveCache();
  if(!sb||!sbSession)return;
  const {error}=await sb.from(CONFIG.TABLE_MEM).upsert(memToRow(m));
  if(error){sync.error=error.message;alert('保存エラー: '+error.message);}
  updateSyncBadge();
}
function updateSyncBadge(){
  const el=document.getElementById('sync-badge');if(!el)return;
  if(!sb){el.innerHTML='<span style="font-size:10px;color:#F59E0B;">Supabase未設定</span>';return;}
  if(sync.syncing){el.innerHTML='<span style="font-size:10px;color:#6B7280;">同期中...</span>';return;}
  if(sync.error){el.innerHTML='<span style="font-size:10px;color:#DC2626;" title="'+esc(sync.error)+'">同期エラー</span>';return;}
  if(sync.lastPullAt){
    const secs=Math.floor((Date.now()-sync.lastPullAt)/1000);
    const tt=secs<60?secs+'秒前':secs<3600?Math.floor(secs/60)+'分前':Math.floor(secs/3600)+'時間前';
    el.innerHTML='<span style="font-size:10px;color:#059669;">共有DB接続中（'+tt+'に取得）</span>';
  }else el.innerHTML='<span style="font-size:10px;color:#6B7280;">未取得</span>';
}

function renderOptionsInput(q){
  const cur=quiz.answers[q.id];
  return q.options.map((o,i)=>`
    <button class="option-btn ${cur===i?'selected':''}" onclick="selectOpt('${q.id}',${i})">
      <div>${esc(o.t[LANG]||o.t.ja)}</div>
      <div style="font-size:11px;color:#9CA3AF;margin-top:4px;">${esc(o.t.ja)}</div>
    </button>`).join('');
}
function startTimer(seconds){
  if(quiz.timerInterval)clearInterval(quiz.timerInterval);
  quiz.timerStart=Date.now();quiz.timerSec=seconds;
  quiz.timerInterval=setInterval(()=>{
    const el=document.getElementById('quiz-timer');
    if(!el){clearInterval(quiz.timerInterval);return;}
    const elapsed=(Date.now()-quiz.timerStart)/1000;
    const r=Math.max(0,quiz.timerSec-elapsed);
    el.textContent=Math.ceil(r);
    if(r<=0){el.style.color='#DC2626';el.style.transform='scale(1.3)';}
    else if(r<3){el.style.color='#DC2626';el.style.transform='scale(1.1)';}
    else if(r<5){el.style.color='#F59E0B';el.style.transform='scale(1)';}
    else{el.style.color='#059669';el.style.transform='scale(1)';}
  },200);
}
function selectOpt(id,i){
  if(quiz.timerStart){const elapsed=(Date.now()-quiz.timerStart)/1000;quiz.timing[id]=Math.round(elapsed*10)/10;}
  quiz.answers[id]=i;render();
}
function updateNextBtn(){
  const q=QUESTIONS[quiz.idx];
  const a=quiz.answers[q.id];
  const btn=document.getElementById('nextBtn');
  if(btn){btn.disabled=a==null;btn.textContent=quiz.idx===QUESTIONS.length-1?t('submit'):t('next');}
}
function prevQ(){if(quiz.idx>0){quiz.idx--;render();}}
function nextQ(){
  const q=QUESTIONS[quiz.idx];
  if(quiz.answers[q.id]==null){alert(t('pleaseAnswer'));return;}
  if(quiz.idx<QUESTIONS.length-1){quiz.idx++;render();}
  else submitQuiz();
}
async function submitQuiz(){
  if(quiz.submitting)return;
  quiz.submitting=true;
  const _btn=document.getElementById('nextBtn');
  if(_btn){_btn.disabled=true;_btn.textContent=t('sending');}
  const submission={
    id:uuid(),submittedAt:nowIso(),updatedAt:nowIso(),updatedBy:'candidate:'+quiz.name,
    name:quiz.name,contact:quiz.contact,lang:LANG,candidateKey:normalizeName(quiz.name),
    answers:quiz.answers,timing:quiz.timing||{},deleted:false
  };
  let directSent=false;
  if(sb){
    try{
      const {error}=await sb.from(CONFIG.TABLE_SUB).insert(subToRow(submission));
      if(error)throw error;
      directSent=true;
    }catch(e){console.error('Direct submit failed:',e);}
  }
  // 送信できなかった場合の予備: 送信コード（管理画面の「コード読込」で取り込める）
  const codePayload={n:quiz.name,c:quiz.contact,l:LANG,a:quiz.answers,ti:quiz.timing,t:submission.submittedAt};
  quiz.code=btoa(unescape(encodeURIComponent(JSON.stringify(codePayload))));
  quiz.directSent=directSent;quiz.step='done';quiz.submitting=false;render();
}

function fmtDate(iso){if(!iso)return'';const d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('ja-JP');}
function fmtDateTime(iso){if(!iso)return'';const d=new Date(iso);return isNaN(d)?'':d.toLocaleString('ja-JP');}
function langLabel(l){return l==='my'?'ミャンマー':l==='id'?'インドネシア':'-';}

// 同一人物の受検履歴（candidateKey でまとめる）
function attemptsOf(s){return activeSubs().filter(x=>(x.candidateKey||normalizeName(x.name))===(s.candidateKey||normalizeName(s.name))).sort((a,b)=>String(a.submittedAt).localeCompare(String(b.submittedAt)));}
function groupedLatest(){
  const map={};
  activeSubs().forEach(s=>{const k=s.candidateKey||normalizeName(s.name);if(!map[k]||String(s.submittedAt)>String(map[k].submittedAt))map[k]=s;});
  return Object.values(map).sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt)));
}
function calcOvertimeStats(s){
  if(!s.timing)return{count:0,avg:0,total:0};
  let count=0,sum=0,total=0;
  Object.entries(s.timing).forEach(([qid,sec])=>{const q=QUESTIONS.find(x=>x.id===qid);if(!q)return;total++;sum+=sec;if(sec>timeLimitFor(q))count++;});
  return{count,avg:total?Math.round(sum/total*10)/10:0,total};
}
function judgeTag(j){return `<span class="tag" style="background:${j.bg};color:${j.color};">${j.label}</span>`;}

  return `
  <div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;" class="no-print">

function updateSubNotes(id,v){const s=state.submissions.find(x=>x.id===id);if(s){s.notes=v;dbUpsertSub(s);}}

function generateAdvice(sc,compats,flags,j){
  const t=sc.traits,r=sc.risks,d=sc.drives||{},f=sc.fit;
  const top3=Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>TRAITS[k].ja);
  const bot3=Object.entries(t).sort((a,b)=>a[1]-b[1]).slice(0,3).map(([k])=>TRAITS[k].ja);
  const dt=getDriveType(d);
  let a='';
  a+=`【目安】${j.label}。${j.reasons[0]||''}\n`;
  a+=`【強み】${top3.join('、')}\n【弱み】${bot3.join('、')}\n`;
  a+=`【深層動機】${dt.ja}（${dt.pct}%）。${dt.desc}\n\n`;
  const fitTop=Object.entries(f).sort((a,b)=>b[1]-a[1])[0];
  const fitBot=FIT_A.map(k=>[k,f[k]]).sort((a,b)=>a[1]-b[1])[0];
  a+=`【${CONFIG.companyName}での働き方】最も高い項目は「${FIT[fitTop[0]].ja}」（${fitTop[1].toFixed(1)}）。定着5項目で最も低いのは「${FIT[fitBot[0]].ja}」（${fitBot[1].toFixed(1)}）。\n`;
  if(f.cold<5)a+=`北海道の冬への適応に不安があります。入国前に冬の生活（服装、暖房費、徒歩通勤）を具体的に説明し、本人の受け止めを確認してください。\n`;
  if(f.remit<5)a+=`仕送りの必要額に対してデイサービスの収入が足りない可能性があります。手取りと生活費のモデルを示して、本人と家族の了解を得ることを推奨します。\n`;
  if(f.day<5)a+=`夜勤や収入増への関心が強く、日勤のみの働き方に物足りなさを感じる可能性があります。\n`;
  if(f.stay<5)a+=`好条件の誘いがあった場合に職場を変える可能性があります。定期的な面談と、キャリアの見通しを早めに示すことが定着の鍵になります。\n`;
  if(f.team<5)a+=`協力や情報共有の姿勢に課題の可能性があります。入職後は役割を明確にし、報告・共有の習慣づけを支援してください。\n`;
  if(mean(FIT_B.map(k=>f[k]))>=7)a+=`稼ぎたい意欲とキャリアアップ志向が強いタイプです。1年後に訪問介護、資格取得、運転業務などへ進む道を示すと意欲を保ちやすい一方、その見通しがないと転職を考えやすい点に注意してください。\n`;
  a+='\n';
  if(dt.type==='money')a+=`【マネジメント】金銭ドライブ型。給与・手当・昇給の仕組みを明確に示すと安定します。他社の好条件には弱いので、定期的な待遇の説明を。\n`;
  else if(dt.type==='prestige')a+=`【マネジメント】承認ドライブ型。成果を明示的に褒め、叱責は人前を避けて個別に。プライドが折れると一気に弱るタイプ。\n`;
  else if(dt.type==='freedom')a+=`【マネジメント】自由ドライブ型。細かい管理より目標管理型で。裁量を与えると伸びますが、過度な管理は意欲を下げます。\n`;
  else if(dt.type==='relation')a+=`【マネジメント】関係ドライブ型。チーム配属で力を発揮。先輩・同僚との関係づくりの支援が定着の鍵。孤立すると弱ります。\n`;
  const reds=flags.filter(f=>f.level==='red');
  if(reds.length){a+=`\n【要確認】${reds.map(f=>f.label).join('、')}。送出側（弊社インドネシア法人またはミャンマー側の送出機関）による追加面談で背景を確認することを推奨します。\n`;}
  const best=compats[0];
  if(best&&best.r.score>=6)a+=`【配置】${best.m.name}との相性が最も良好です（${best.r.score.toFixed(1)}/10）。${best.r.advice}。\n`;
  if(r.revenge>6)a+=`【見返し心】高め。指導の伝え方に注意（人前ではなく個別に）。\n`;
  if(r.impulse>6)a+=`【衝動性】高め。同じ訴えの繰り返し対応でストレスを溜めやすい。\n`;
  if(t.resil<5)a+=`【ストレス耐性】低め。失敗時の励まし体制を準備してください。\n`;
  if(t.careAcc<5)a+=`【介助受容性】低め（${t.careAcc.toFixed(1)}/10）。排泄介助等への抵抗感の可能性。業務内容の丁寧な説明と実習を推奨します。\n`;
  if(t.empathy>=7)a+=`【共感性】高い（${t.empathy.toFixed(1)}/10）。利用者との信頼関係を築きやすい介護向きの資質です。\n`;
  return a.trim();
}

// 在籍者（2期生など）の受検結果を既存メンバー（相性の基準）として登録
async function registerAsMember(subId){
  const s=state.submissions.find(x=>x.id===subId);if(!s)return;
  const existing=activeMembers().find(m=>m.sourceSubmissionId===subId||normalizeName(m.name)===normalizeName(s.name));
  if(existing&&!confirm(`${existing.name} はすでに既存メンバーに登録されています。この受検結果で上書きしますか？`))return;
  const sc=calcScores(s.answers);
  const m=existing||{id:uuid(),name:s.name,company:CONFIG.companyName,isBenchmark:false,notes:''};
  m.traits={};Object.keys(TRAITS).forEach(k=>m.traits[k]=Math.round(sc.traits[k]*10)/10);
  m.risks={};Object.keys(RISKS).forEach(k=>m.risks[k]=Math.round(sc.risks[k]*10)/10);
  m.drives={};Object.keys(DRIVES).forEach(k=>m.drives[k]=Math.round(sc.drives[k]));
  m.fit={};Object.keys(FIT).forEach(k=>m.fit[k]=Math.round(sc.fit[k]*10)/10);
  m.sourceSubmissionId=subId;m.deleted=false;
  if(!existing)state.members.push(m);
  await dbUpsertMem(m);
  alert(`${m.name} を既存メンバーとして登録しました。`);render();
}

let matcherSel={};
function toggleMatcherSel(id){if(matcherSel[id])delete matcherSel[id];else matcherSel[id]=true;render();}
function matcherSelectAll(type){getAllPeople().forEach(p=>{if(!type||p.type===type)matcherSel[p.id]=true;});render();}
function matcherClearAll(){matcherSel={};render();}
function renderMatrixView(){
  const all=getAllPeople();
  if(all.length<2)return `<div class="card" style="text-align:center;padding:40px;"><h3 style="margin:0 0 8px;">相性マトリクス</h3><p style="font-size:13px;color:#6B7280;">候補者と既存メンバーを合わせて2名以上必要です。</p></div>`;
  const cands=all.filter(p=>p.type==='candidate'),mems=all.filter(p=>p.type==='member');
  const selected=Object.keys(matcherSel).map(id=>all.find(p=>p.id===id)).filter(Boolean);
  const personCard=(p)=>{
    const checked=!!matcherSel[p.id];
    const bg=p.type==='candidate'?'#E6F4F1':'#DBEAFE',bd=p.type==='candidate'?'#2A9D8F':'#3B82F6';
    return `<label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:2px solid ${checked?bd:'#E5E7EB'};background:${checked?bg:'#fff'};border-radius:8px;cursor:pointer;font-size:13px;"><input type="checkbox" ${checked?'checked':''} onchange="toggleMatcherSel('${p.id}')" style="width:16px;height:16px;cursor:pointer;"><div style="flex:1;min-width:0;"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(p.name)}</div><div style="font-size:10px;color:#6B7280;">${esc(p.subtitle)}</div></div></label>`;
  };
  const cellStyle=(sc)=>{const bg=sc>=8?'#D1FAE5':sc>=6?'#DBEAFE':sc>=4?'#FEF3C7':'#FEE2E2';const col=sc>=8?'#065F46':sc>=6?'#1E40AF':sc>=4?'#92400E':'#991B1B';return {bg,col};};
  return `
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <div><h2 style="font-size:20px;font-weight:700;margin:0 0 4px;">相性マトリクス</h2><p style="font-size:13px;color:#6B7280;margin:0;">候補者と${esc(CONFIG.companyName)}の既存メンバーを組み合わせて相性を確認します。</p></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn-secondary" style="font-size:11px;padding:6px 10px;" onclick="matcherSelectAll('candidate')">候補者全選択</button>
        <button class="btn-secondary" style="font-size:11px;padding:6px 10px;" onclick="matcherSelectAll('member')">既存全選択</button>
        <button class="btn-secondary" style="font-size:11px;padding:6px 10px;" onclick="matcherSelectAll(null)">全員選択</button>
        <button class="btn-secondary btn-danger" style="font-size:11px;padding:6px 10px;" onclick="matcherClearAll()">クリア</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;" id="grid-charts">
      <div class="card"><h3 style="font-size:13px;font-weight:700;margin:0 0 10px;color:#1E7168;">候補者（${cands.length}名）</h3>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;max-height:300px;overflow-y:auto;">${cands.length===0?'<p style="font-size:12px;color:#9CA3AF;">候補者がまだ登録されていません</p>':cands.map(personCard).join('')}</div></div>
      <div class="card"><h3 style="font-size:13px;font-weight:700;margin:0 0 10px;color:#1E40AF;">既存メンバー（${mems.length}名）</h3>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;max-height:300px;overflow-y:auto;">${mems.length===0?'<p style="font-size:12px;color:#9CA3AF;">既存メンバーが登録されていません</p>':mems.map(personCard).join('')}</div></div>
    </div>
    ${selected.length<2?`<div class="card" style="text-align:center;padding:30px;background:#FEF3C7;border-color:#FDE68A;"><p style="font-size:14px;color:#92400E;margin:0;">上のリストから<strong>2名以上</strong>選択すると、相性マトリクスが表示されます</p><p style="font-size:11px;color:#92400E;margin:8px 0 0;">現在: ${selected.length}名選択中</p></div>`:`
    <div class="card" style="overflow-x:auto;">
      <h3 style="font-size:14px;font-weight:700;margin:0 0 10px;">相性マトリクス（${selected.length}名 × ${selected.length}名）</h3>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="border-bottom:2px solid #E5E7EB;"><th style="text-align:left;padding:10px;font-size:11px;color:#6B7280;">人物名</th>${selected.map(p=>`<th style="padding:8px;text-align:center;font-size:11px;min-width:80px;"><div style="font-weight:700;">${esc(p.name)}</div><div style="font-size:9px;color:#9CA3AF;font-weight:400;">${esc(p.subtitle)}</div></th>`).join('')}<th style="padding:8px;text-align:center;background:#F9FAFB;font-size:11px;">平均</th></tr></thead>
        <tbody>${selected.map(pa=>{
          const rows=selected.map(pb=>pa.id===pb.id?null:calcPairCompat(pa,pb));
          const avg=rows.filter(r=>r).reduce((a,r)=>a+r.score,0)/(rows.filter(r=>r).length||1);
          return `<tr style="border-bottom:1px solid #F3F4F6;"><td style="padding:8px;font-weight:600;font-size:12px;">${esc(pa.name)}<br><span style="font-size:10px;color:#9CA3AF;font-weight:400;">${esc(pa.subtitle)}</span></td>${rows.map((r,i)=>{
            if(!r)return `<td style="padding:6px;"><div style="text-align:center;padding:8px;background:#F3F4F6;color:#9CA3AF;border-radius:6px;">-</div></td>`;
            const st=cellStyle(r.score);
            return `<td style="padding:4px;"><div onclick="showPairDetail('${pa.id}','${selected[i].id}')" style="text-align:center;padding:8px;background:${st.bg};color:${st.col};border-radius:6px;font-weight:700;cursor:pointer;" title="クリックで詳細">${r.score.toFixed(1)}</div></td>`;
          }).join('')}<td style="padding:8px;text-align:center;background:#F9FAFB;font-weight:700;">${avg.toFixed(1)}</td></tr>`;
        }).join('')}</tbody>
      </table>
      <p style="margin-top:12px;font-size:11px;color:#6B7280;">セルをクリックすると2人の詳細な相性分析が表示されます。</p>
    </div>
    <div style="margin-top:14px;background:#F9FAFB;border-radius:8px;padding:12px;">
      <h4 style="font-size:12px;font-weight:700;margin:0 0 6px;">相性の良いペア（スコア順）</h4>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;">${(()=>{
        const pairs=[];
        for(let i=0;i<selected.length;i++)for(let j=i+1;j<selected.length;j++)pairs.push({a:selected[i],b:selected[j],r:calcPairCompat(selected[i],selected[j])});
        return pairs.sort((x,y)=>y.r.score-x.r.score).slice(0,6).map(({a,b,r})=>`<div style="background:${cellStyle(r.score).bg};padding:8px 10px;border-radius:6px;font-size:11px;cursor:pointer;" onclick="showPairDetail('${a.id}','${b.id}')"><strong>${esc(a.name)}</strong> × <strong>${esc(b.name)}</strong> <span style="float:right;font-weight:700;">${r.score.toFixed(1)}</span></div>`).join('');
      })()}</div>
    </div>`}`;
}
function showPairDetail(aId,bId){
  const all=getAllPeople();const a=all.find(p=>p.id===aId),b=all.find(p=>p.id===bId);if(!a||!b)return;
  const r=calcPairCompat(a,b);
  const traitRows=Object.entries(TRAITS).map(([k,v])=>{const av=a.traits[k]??5,bv=b.traits[k]??5;const diff=Math.abs(av-bv);const color=diff<=2?'#10B981':diff<=4?'#F59E0B':'#EF4444';
    return `<tr style="border-bottom:1px solid #F3F4F6;"><td style="padding:6px 8px;font-size:11px;">${v.ja}</td><td style="padding:6px;text-align:center;font-weight:600;font-size:12px;">${av.toFixed(1)}</td><td style="padding:6px;text-align:center;font-size:11px;color:${color};">差 ${diff.toFixed(1)}</td><td style="padding:6px;text-align:center;font-weight:600;font-size:12px;">${bv.toFixed(1)}</td></tr>`;}).join('');
  const html=`<div class="modal-bg" onclick="if(event.target===this)this.remove()"><div class="card" style="max-width:620px;width:100%;max-height:90vh;overflow-y:auto;" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:14px;"><div><h2 style="margin:0;font-size:18px;font-weight:700;">${esc(a.name)} × ${esc(b.name)}</h2><p style="margin:4px 0 0;font-size:11px;color:#6B7280;">${esc(a.subtitle)} / ${esc(b.subtitle)}</p></div><div style="font-size:28px;font-weight:800;color:#2A9D8F;">${r.score.toFixed(1)}<span style="font-size:12px;color:#9CA3AF;">/10</span></div></div>
    <p style="font-size:13px;font-weight:600;margin:0 0 10px;">${r.advice}</p>
    ${r.positives.length?`<p style="font-size:12px;color:#065F46;margin:0 0 6px;">良い点: ${r.positives.join('、')}</p>`:''}
    ${r.risks.length?`<p style="font-size:12px;color:#991B1B;margin:0 0 10px;">注意: ${r.risks.join('、')}</p>`:''}
    <table style="width:100%;border-collapse:collapse;"><thead><tr style="border-bottom:2px solid #E5E7EB;"><th style="text-align:left;padding:6px 8px;font-size:11px;color:#6B7280;">特性</th><th style="font-size:11px;color:#6B7280;">${esc(a.name)}</th><th></th><th style="font-size:11px;color:#6B7280;">${esc(b.name)}</th></tr></thead><tbody>${traitRows}</tbody></table>
    <button class="btn-secondary btn-block" style="margin-top:14px;" onclick="this.closest('.modal-bg').remove()">閉じる</button>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}

function renderMembersView(){
  const ms=activeMembers();
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
      <div>
        <h2 style="font-size:20px;font-weight:700;margin:0 0 4px;">既存メンバー（${esc(CONFIG.companyName)}）</h2>
        <p style="font-size:13px;color:#6B7280;margin:0;">相性計算の基準となる在籍メンバー（${ms.length}名）。在籍者が受検した場合は、詳細画面の「既存メンバーとして登録」で取り込めます。</p>
      </div>
      <button class="btn-primary" style="font-size:13px;padding:10px 16px;" onclick="addMember()">メンバーを手動追加</button>
    </div>
    ${ms.length===0?'<div class="card" style="text-align:center;padding:30px;color:#6B7280;font-size:13px;">まだ登録がありません。</div>':''}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;">
    ${ms.map(m=>`
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:start;">
          <div><h3 style="margin:0;font-size:15px;font-weight:700;">${esc(m.name)} ${m.isBenchmark?'<span class="tag tag-green">基準</span>':''}</h3>
          <p style="margin:2px 0 0;font-size:11px;color:#9CA3AF;">${esc(m.company||CONFIG.companyName)}${m.sourceSubmissionId?'　受検結果から登録':''}</p></div>
          <button class="btn-secondary" style="font-size:11px;padding:4px 10px;" onclick="editMember('${m.id}')">編集</button>
        </div>
        <div class="chart-box-sm" style="margin-top:10px;"><canvas data-scores='${JSON.stringify(m.traits||{})}' data-kind="traits"></canvas></div>
        ${m.fit&&Object.keys(m.fit).length?`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px;">${Object.keys(FIT).map(k=>`<div style="text-align:center;"><div style="font-size:9px;color:#9CA3AF;white-space:nowrap;">${FIT[k].tiny}</div><div style="font-size:12px;font-weight:700;">${(m.fit[k]??0).toFixed(1)}</div></div>`).join('')}</div>`:''}
        <p style="font-size:11px;color:#6B7280;margin:8px 0 0;">${esc(m.notes||'')}</p>
      </div>`).join('')}
    </div>`;
}
function addMember(){
  const name=prompt('メンバー名（漢字・カタカナ・ローマ字いずれか）:');
  if(!name)return;
  const m={id:uuid(),name,company:CONFIG.companyName,isBenchmark:false,traits:{},risks:{},drives:{money:25,prestige:25,freedom:25,relation:25},fit:{},notes:''};
  Object.keys(TRAITS).forEach(k=>m.traits[k]=5);Object.keys(RISKS).forEach(k=>m.risks[k]=3);
  state.members.push(m);dbUpsertMem(m).then(()=>render());editMember(m.id);
}
function editMember(id){
  const m=state.members.find(x=>x.id===id);if(!m)return;
  const html=`<div class="modal-bg" onclick="if(event.target===this){this.remove();render();}"><div class="card" style="max-width:520px;width:100%;max-height:90vh;overflow-y:auto;" onclick="event.stopPropagation()">
    <h3 style="margin:0 0 12px;">${esc(m.name)} の編集</h3>
    <div style="margin-bottom:10px;"><label class="label">名前</label><input class="input" value="${esc(m.name)}" onchange="m_update('${m.id}','name',this.value)"></div>
    <div style="margin-bottom:10px;"><label class="label">所属</label><input class="input" value="${esc(m.company||CONFIG.companyName)}" onchange="m_update('${m.id}','company',this.value)"></div>
    <div style="margin-bottom:10px;"><label class="label">備考</label><textarea class="textarea" rows="2" onchange="m_update('${m.id}','notes',this.value)">${esc(m.notes||'')}</textarea></div>
    <div style="margin-bottom:10px;"><label style="font-size:12px;display:flex;align-items:center;gap:6px;"><input type="checkbox" ${m.isBenchmark?'checked':''} onchange="m_update('${m.id}','isBenchmark',this.checked)">基準メンバー（模範となる在籍者）</label></div>
    <h4 style="font-size:13px;font-weight:700;margin:14px 0 8px;">特性スコア (0-10)</h4>
    ${Object.entries(TRAITS).map(([k,v])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;"><label style="flex:1;font-size:12px;">${v.ja}</label><input type="range" min="0" max="10" step="0.5" value="${m.traits[k]??5}" oninput="m_setNum('${m.id}','traits','${k}',this.value);this.nextElementSibling.textContent=this.value"><span style="font-size:12px;width:30px;text-align:right;font-weight:600;">${m.traits[k]??5}</span></div>`).join('')}
    <h4 style="font-size:13px;font-weight:700;margin:14px 0 8px;">注意点の指標 (0-10)</h4>
    ${Object.entries(RISKS).map(([k,v])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;"><label style="flex:1;font-size:12px;">${v.ja}</label><input type="range" min="0" max="10" step="0.5" value="${m.risks[k]??3}" oninput="m_setNum('${m.id}','risks','${k}',this.value);this.nextElementSibling.textContent=this.value"><span style="font-size:12px;width:30px;text-align:right;font-weight:600;">${m.risks[k]??3}</span></div>`).join('')}
    <h4 style="font-size:13px;font-weight:700;margin:14px 0 8px;">7項目 (0-10)</h4>
    ${Object.entries(FIT).map(([k,v])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;"><label style="flex:1;font-size:12px;">${v.ja}</label><input type="range" min="0" max="10" step="0.5" value="${(m.fit||{})[k]??5}" oninput="m_setNum('${m.id}','fit','${k}',this.value);this.nextElementSibling.textContent=this.value"><span style="font-size:12px;width:30px;text-align:right;font-weight:600;">${(m.fit||{})[k]??5}</span></div>`).join('')}
    <h4 style="font-size:13px;font-weight:700;margin:14px 0 8px;">動機ドライブ (%)</h4>
    ${Object.entries(DRIVES).map(([k,v])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;"><label style="flex:1;font-size:12px;color:${v.color};">${v.ja}</label><input type="range" min="0" max="100" step="5" value="${(m.drives||{})[k]??25}" oninput="m_setNum('${m.id}','drives','${k}',this.value);this.nextElementSibling.textContent=this.value+'%'"><span style="font-size:12px;width:40px;text-align:right;font-weight:600;">${(m.drives||{})[k]??25}%</span></div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn-secondary btn-danger" style="flex:1;" onclick="m_delete('${m.id}');this.closest('.modal-bg').remove()">削除</button>
      <button class="btn-primary" style="flex:2;" onclick="this.closest('.modal-bg').remove();render()">完了</button>
    </div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
let _memTimer=null;
function _memSave(m){clearTimeout(_memTimer);_memTimer=setTimeout(()=>dbUpsertMem(m),600);}
function m_update(id,k,v){const m=state.members.find(x=>x.id===id);if(m){m[k]=v;_memSave(m);}}
function m_setNum(id,group,k,v){const m=state.members.find(x=>x.id===id);if(m){if(!m[group])m[group]={};m[group][k]=parseFloat(v);_memSave(m);}}
function m_delete(id){if(!confirm('このメンバーを削除しますか？'))return;const m=state.members.find(x=>x.id===id);if(m){m.deleted=true;dbUpsertMem(m).then(()=>render());}}

function renderGuideView(){
  const base=location.origin+location.pathname;
  return `
  <div class="card" style="max-width:860px;">
    <h2 style="font-size:20px;font-weight:700;margin:0 0 12px;">使い方</h2>
    <div class="disclaimer" style="margin-bottom:16px;">${DISCLAIMER_JA} 「合否」や「予測」のために使わず、面接で確認する観点を整理するために使ってください。</div>
    <h3 style="font-size:15px;margin:16px 0 6px;">1. 候補者に回答してもらう</h3>
    <ul style="font-size:13px;line-height:1.9;padding-left:20px;margin:0;">
      <li>ミャンマー人材: <code>${esc(base)}?mode=quiz&lang=my</code></li>
      <li>インドネシア人材: <code>${esc(base)}?mode=quiz&lang=id</code></li>
      <li>言語を候補者に選ばせる場合: <code>${esc(base)}?mode=quiz</code></li>
      <li>67問、15〜20分。各問に制限時間（通常15秒、生活と働き方20秒、即答8秒）があります。</li>
      <li>送信に失敗した場合、候補者の画面に「送信コード」が出ます。受け取ったコードは右上の「コード読込」で取り込めます。</li>
    </ul>
    <h3 style="font-size:15px;margin:16px 0 6px;">2. 結果の見方</h3>
    <ul style="font-size:13px;line-height:1.9;padding-left:20px;margin:0;">
      <li><strong>7項目（10点満点）</strong>: 定着プラン向きの5項目（日勤安定、仕送り整合、寒冷適応、協力・責任、同じ職場で長く）と、訪問系ルートの2項目（稼ぎたい意欲、キャリア志向）。5点が中立です。</li>
      <li><strong>目安</strong>: 「定着プラン向き」「訪問系ルート向き」「どちらとも言えない」の3つ。判定の根拠を必ず併記しています。</li>
      <li><strong>回答の一貫性</strong>: 逆の意味になる質問の組み合わせ${CONSISTENCY.length}組を照合し、矛盾の数で高・中・低を表示します。低い場合は目安を保留し、面接での確認を優先してください。</li>
      <li><strong>面接で確かめたい点</strong>: 矛盾した回答と、点数が低い定着項目から最大3つを自動で挙げます。</li>
      <li><strong>14特性・注意点・深層動機</strong>: 従来の介護性格診断と同じ指標です。</li>
      <li><strong>受検履歴</strong>: 同じ氏名で複数回受検した場合、詳細画面に履歴表と前回との差を表示します。在籍中の2期生の再受検にも使えます。</li>
    </ul>
    <h3 style="font-size:15px;margin:16px 0 6px;">3. 既存メンバーと相性</h3>
    <ul style="font-size:13px;line-height:1.9;padding-left:20px;margin:0;">
      <li>在籍者が受検した結果は、詳細画面の「既存メンバーとして登録」で相性計算の基準に取り込めます。</li>
      <li>相性は14特性の近さに、情緒・飲酒・衝動性などの組み合わせ補正を加えて算出します。</li>
    </ul>
    <h3 style="font-size:15px;margin:16px 0 6px;">4. レポートの印刷</h3>
    <ul style="font-size:13px;line-height:1.9;padding-left:20px;margin:0;">
      <li>詳細画面の「診断結果レポートを印刷 / PDF」からブラウザの印刷画面を開き、PDFとして保存できます。</li>
      <li>「回答一覧も印刷する」にチェックを入れると、67問の回答も含めて出力します。</li>
    </ul>
    <h3 style="font-size:15px;margin:16px 0 6px;">5. データと安全</h3>
    <ul style="font-size:13px;line-height:1.9;padding-left:20px;margin:0;">
      <li>回答は共有データベース（Supabase）に保存され、ログインした担当者だけが閲覧できます。候補者側は自分の回答の送信だけができます。</li>
      <li>候補者の氏名・連絡先・回答は個人情報です。レポートの共有先はノアコンツェル様の採用担当者に限定してください。</li>
    </ul>
  </div>`;
}

//==========================================================
// 設定・候補者URL・コード読込・書出
//==========================================================
function openSettings(){
  const html=`<div class="modal-bg" onclick="if(event.target===this)this.remove()"><div class="card" style="max-width:520px;width:100%;" onclick="event.stopPropagation()">
    <h3 style="margin:0 0 4px;font-size:18px;font-weight:700;">設定</h3>
    <div style="margin:14px 0;"><label class="label">担当者名（編集履歴に表示）</label><input class="input" id="set-user" value="${esc(settings.userName||'')}"></div>
    <div style="background:#F9FAFB;padding:10px;border-radius:6px;margin-bottom:14px;font-size:11px;color:#4B5563;line-height:1.6;">
      <strong>接続先:</strong> ${esc(CONFIG.SUPABASE_URL)}<br>
      <strong>テーブル:</strong> ${CONFIG.TABLE_SUB} / ${CONFIG.TABLE_MEM}<br>
      <strong>ログイン:</strong> ${esc(settings.adminEmail||'')}<br>
      <strong>最終取得:</strong> ${sync.lastPullAt?sync.lastPullAt.toLocaleString('ja-JP'):'未取得'}${sync.error?'<br><span style="color:#DC2626;">エラー: '+esc(sync.error)+'</span>':''}
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn-secondary" style="flex:1;" onclick="this.closest('.modal-bg').remove()">キャンセル</button>
      <button class="btn-primary" style="flex:2;" onclick="saveSettingsFromForm()">保存</button>
    </div>
    <details style="margin-top:14px;"><summary style="cursor:pointer;font-size:12px;color:#6B7280;">詳細</summary>
      <div style="font-size:11px;color:#4B5563;line-height:1.6;padding:8px 0 0;">
        <p>端末内のキャッシュを消して共有DBから再取得します（共有DBのデータは消えません）。</p>
        <button class="btn-secondary btn-danger" style="font-size:11px;padding:6px 10px;" onclick="if(confirm('端末内キャッシュを削除して再取得しますか？'))resetLocal()">キャッシュ削除</button>
      </div></details>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
function saveSettingsFromForm(){const name=document.getElementById('set-user').value.trim();if(!name){alert('お名前を入力してください');return;}settings.userName=name;saveSettings();document.querySelector('.modal-bg').remove();render();}
function resetLocal(){localStorage.removeItem(STORAGE_KEY);state={submissions:[],members:[]};document.querySelector('.modal-bg').remove();syncPull().then(()=>render());}
function openCandidateLink(){
  const base=location.origin+location.pathname;
  const row=(label,url)=>`<div style="margin-bottom:12px;"><label class="label">${label}</label><div style="display:flex;gap:6px;"><input class="input" readonly value="${url}" style="font-size:12px;padding:10px;" onclick="this.select()"><button class="btn-secondary btn-sm" onclick="navigator.clipboard.writeText('${url}');this.textContent='コピー済'">コピー</button></div></div>`;
  const html=`<div class="modal-bg" onclick="if(event.target===this)this.remove()"><div class="card" style="max-width:520px;width:100%;" onclick="event.stopPropagation()">
    <h3 style="margin:0 0 12px;">候補者URL</h3>
    <p style="font-size:12px;color:#6B7280;margin:0 0 10px;">候補者の言語に合わせたURLを Viber / WhatsApp で送ってください。</p>
    ${row('ミャンマー人材（ビルマ語＋日本語）',base+'?mode=quiz&lang=my')}
    ${row('インドネシア人材（インドネシア語＋日本語）',base+'?mode=quiz&lang=id')}
    ${row('言語を候補者に選ばせる',base+'?mode=quiz')}
    <button class="btn-secondary btn-block" style="margin-top:4px;" onclick="this.closest('.modal-bg').remove()">閉じる</button>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
function showImportCode(){
  const html=`<div class="modal-bg" onclick="if(event.target===this)this.remove()"><div class="card" style="max-width:520px;width:100%;" onclick="event.stopPropagation()">
    <h3 style="margin:0 0 12px;">送信コード読込</h3>
    <p style="font-size:12px;color:#6B7280;margin:0 0 10px;">候補者から受け取った送信コードを貼り付けてください。</p>
    <textarea class="textarea" id="import-code" rows="6" placeholder="ここにコードを貼り付け" style="font-family:monospace;font-size:11px;"></textarea>
    <button class="btn-primary btn-block" style="margin-top:10px;" onclick="importCode()">読込</button>
    <button class="btn-secondary btn-block" style="margin-top:8px;" onclick="this.closest('.modal-bg').remove()">閉じる</button>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
async function importCode(){
  const code=document.getElementById('import-code').value.trim();
  if(!code){alert('コードを入力してください');return;}
  try{
    const p=JSON.parse(decodeURIComponent(escape(atob(code))));
    if(!p.n||!p.a)throw new Error('invalid');
    const s={id:uuid(),submittedAt:p.t||nowIso(),name:p.n,contact:p.c||'',lang:p.l||'',candidateKey:normalizeName(p.n),answers:p.a,timing:p.ti||{},deleted:false};
    state.submissions.push(s);await dbUpsertSub(s);
    document.querySelector('.modal-bg').remove();setView('list');alert('読込完了: '+p.n);
  }catch(e){alert('コードの形式が不正です: '+e.message);}
}
function deleteSubmission(id){
  if(!confirm('この提出を削除しますか？（共有DBでは削除済みの印が付き、一覧から消えます）'))return;
  const s=state.submissions.find(x=>x.id===id);
  if(s){s.deleted=true;dbUpsertSub(s).then(()=>{setView('list');});}
}
function exportJSON(){
  const blob=new Blob([JSON.stringify({exportedAt:nowIso(),submissions:activeSubs(),members:activeMembers()},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='noah-kaigo-export-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);
}

//==========================================================
// チャート
//==========================================================
function initCharts(){
  document.querySelectorAll('canvas[data-scores]').forEach(c=>{
    if(c._chart)c._chart.destroy();
    const kind=c.dataset.kind||'traits';
    const dict=kind==='fit'?FIT:TRAITS;
    const scores=JSON.parse(c.dataset.scores);
    const keys=Object.keys(dict);
    const labels=keys.map(k=>kind==='fit'?dict[k].short:dict[k].ja);
    const data=keys.map(k=>scores[k]??5);
    const datasets=[{label:'今回',data,backgroundColor:kind==='fit'?'rgba(59,130,246,.18)':'rgba(42,157,143,.2)',borderColor:kind==='fit'?'#3B82F6':'#2A9D8F',borderWidth:2,pointBackgroundColor:kind==='fit'?'#3B82F6':'#2A9D8F',pointRadius:3}];
    if(c.dataset.prev){const pv=JSON.parse(c.dataset.prev);datasets.push({label:'前回',data:keys.map(k=>pv[k]??5),backgroundColor:'rgba(156,163,175,.08)',borderColor:'#9CA3AF',borderWidth:1.5,borderDash:[4,3],pointRadius:2,pointBackgroundColor:'#9CA3AF'});}
    c._chart=new Chart(c,{type:'radar',data:{labels,datasets},
      options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:datasets.length>1,labels:{font:{size:10}}}},
        scales:{r:{min:0,max:10,beginAtZero:true,ticks:{stepSize:2,backdropColor:'transparent',font:{size:9}},pointLabels:{font:{size:kind==='fit'?11:10}}}}}});
  });
}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

//==========================================================
// 起動
//==========================================================
(async function boot(){
  if(LANG)document.documentElement.lang=LANG;
  if(MODE==='admin'&&sb){
    try{const {data}=await sb.auth.getSession();sbSession=data.session||null;}catch(e){console.warn(e);}
    sb.auth.onAuthStateChange((_e,session)=>{sbSession=session;if(!session&&MODE==='admin'&&!document.hidden){/* トークン失効時はログイン画面へ */render();}});
  }
  render();
  if(MODE==='admin'&&isLoggedIn()){await syncPull(true);render();}
})();
</script>
